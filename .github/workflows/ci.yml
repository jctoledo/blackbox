name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_sha:
        description: Immutable reviewed head (empty for ordinary CI)
        required: true
        type: string
      pr_number:
        required: true
        type: string
permissions:
  actions: read
  contents: read
  pages: read
  pull-requests: read
concurrency:
  group: blackbox-ci-${{ inputs.checkout_sha && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.checkout_sha }}
jobs:
  validate:
    runs-on: [blackbox-lat]
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Recheck reviewed PR before executing its source
        if: inputs.checkout_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          REVIEWED_SHA: ${{ inputs.checkout_sha }}
        run: python3 scripts/reviewed_pr_ci.py guard
      - uses: actions/checkout@v6
        if: inputs.checkout_sha != ''
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false
      - name: Verify immutable checkout
        if: inputs.checkout_sha != ''
        env:
          REVIEWED_SHA: ${{ inputs.checkout_sha }}
        run: test "$(git rev-parse HEAD)" = "$REVIEWED_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Host regression tests
        run: |
          source "$GITHUB_WORKSPACE/scripts/cargo-cache.sh" stable host
          python3 scripts/embed_dashboard_fonts.py --check
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable test --locked -p sensor-fusion -p wt901 -p ublox-gps -p blackbox-host-tests
          npm ci --ignore-scripts
          node --test tests/*.test.cjs
          cargo +stable run --quiet --locked -p blackbox-host-tests --example packet_fixture > "$RUNNER_TEMP/telemetry-v4.hex"
          diff tests/fixtures/telemetry-v4.hex "$RUNNER_TEMP/telemetry-v4.hex"
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo +stable check --locked -p ublox-gps --no-default-features
      - name: Documentation and Python lint
        run: |
          python3 -m venv "$RUNNER_TEMP/blackbox-python"
          "$RUNNER_TEMP/blackbox-python/bin/pip" install 'Markdown==3.7' flake8
          "$RUNNER_TEMP/blackbox-python/bin/python" scripts/build_docs.py
          python3 scripts/check_docs_site.py
          "$RUNNER_TEMP/blackbox-python/bin/flake8" tools/python/*.py --count --max-line-length=120 --ignore=E203,E302,E305,F541,W503 --statistics
      - name: Check and build both GPS variants
        working-directory: sensors/blackbox
        run: |
          for model in 6m m9n; do
            export GPS_MODEL="$model"
            if [ "$model" = m9n ]; then export GPS_RATE=25; else export GPS_RATE=5; fi
            source "$GITHUB_WORKSPACE/scripts/cargo-cache.sh" nightly-2025-10-18 firmware
            cargo +nightly-2025-10-18 clippy --locked --release -- -D warnings
            cargo +nightly-2025-10-18 build --locked --release
          done
      - name: Upload protocol artifact
        uses: actions/upload-artifact@v6
        with:
          name: protocol-fixture
          path: tests/fixtures/telemetry-v4.hex
          retention-days: 1
      - name: Wait for artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_artifact.py protocol-fixture

      # The REST index can become visible before the download endpoint is ready.
      # Inspect outcome (before continue-on-error), and leave the last attempt fatal.
      - name: Download protocol artifact (attempt 1 of 3)
        id: protocol_download_1
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v7
        with:
          name: protocol-fixture
          github-token: ${{ github.token }}
          path: artifact-check
      - name: Wait before second protocol download
        if: steps.protocol_download_1.outcome == 'failure'
        run: sleep 3
      - name: Download protocol artifact (attempt 2 of 3)
        id: protocol_download_2
        if: steps.protocol_download_1.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/download-artifact@v7
        with:
          name: protocol-fixture
          github-token: ${{ github.token }}
          path: artifact-check
      - name: Wait before final protocol download
        if: steps.protocol_download_2.outcome == 'failure'
        run: sleep 3
      - name: Download protocol artifact (attempt 3 of 3)
        if: steps.protocol_download_2.outcome == 'failure'
        timeout-minutes: 2
        uses: actions/download-artifact@v7
        with:
          name: protocol-fixture
          github-token: ${{ github.token }}
          path: artifact-check
      - name: Verify artifact round trip
        run: diff tests/fixtures/telemetry-v4.hex artifact-check/telemetry-v4.hex
      - name: Validate Pages configuration
        uses: actions/configure-pages@v5
      - name: Validate Pages packaging
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1
