name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: blackbox-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: [blackbox-lat]
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Host regression tests
        run: |
          rustup component add rustfmt --toolchain stable
          cargo +stable fmt --all -- --check
          cargo +stable test --locked -p sensor-fusion -p wt901 -p ublox-gps -p blackbox-host-tests
          node --test tests/*.test.cjs
          cargo +stable run --quiet --locked -p blackbox-host-tests --example packet_fixture > "$RUNNER_TEMP/telemetry-v4.hex"
          diff tests/fixtures/telemetry-v4.hex "$RUNNER_TEMP/telemetry-v4.hex"
          python3 -m unittest discover -s tests -p 'test_*.py'
          cargo +stable check --locked -p ublox-gps --no-default-features
      - name: Documentation and Python lint
        run: |
          python3 -m venv "$RUNNER_TEMP/blackbox-python"
          "$RUNNER_TEMP/blackbox-python/bin/pip" install 'Markdown==3.7' flake8
          "$RUNNER_TEMP/blackbox-python/bin/python" scripts/build_docs.py
          "$RUNNER_TEMP/blackbox-python/bin/flake8" tools/python/*.py --count --max-line-length=120 --ignore=E203,E302,E305,F541,W503 --statistics
      - name: Check and build both GPS variants
        working-directory: sensors/blackbox
        run: |
          for model in 6m m9n; do
            export GPS_MODEL="$model"
            if [ "$model" = m9n ]; then export GPS_RATE=25; else export GPS_RATE=5; fi
            cargo +nightly-2025-10-18 clippy --locked --release -- -D warnings
            cargo +nightly-2025-10-18 build --locked --release
          done
