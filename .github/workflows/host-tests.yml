name: Host regression tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p sensor-fusion -p wt901 -p ublox-gps -p blackbox-host-tests
      - run: node --test tests/*.test.cjs
      - run: |
          cargo run --quiet --locked -p blackbox-host-tests --example packet_fixture > /tmp/telemetry-v4.hex
          diff tests/fixtures/telemetry-v4.hex /tmp/telemetry-v4.hex
          python3 -m unittest discover -s tests -p 'test_*.py'
