name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [Release]
    types: [completed]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [blackbox-lat]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stage verified firmware on Pages origin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/prepare_web_firmware.py

      - name: Render crawlable documentation
        run: |
          python3 -m venv "$RUNNER_TEMP/docs-python"
          "$RUNNER_TEMP/docs-python/bin/pip" install 'Markdown==3.7'
          "$RUNNER_TEMP/docs-python/bin/python" scripts/build_docs.py
          python3 scripts/check_docs_site.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        id: pages_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'docs'

      - name: Wait for artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_artifact.py github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages_artifact.outputs.artifact_id }}
        run: python3 scripts/deploy_pages.py
