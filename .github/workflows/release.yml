name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  discover-projects:
    name: Discover Sensor Projects
    runs-on: [blackbox-lat]
    outputs:
      projects: ${{ steps.find-projects.outputs.projects }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find all sensor projects
        id: find-projects
        run: |
          # Find all directories in sensors/ that have a project.json file
          projects=$(python3 -c 'import json,pathlib; print(json.dumps(sorted(p.parent.name for p in pathlib.Path("sensors").glob("*/project.json"))))')
          echo "projects=$projects" >> $GITHUB_OUTPUT
          echo "Found projects: $projects"

  build-firmware:
    name: Build Firmware
    needs: discover-projects
    runs-on: [blackbox-lat]
    strategy:
      matrix:
        project: ${{ fromJson(needs.discover-projects.outputs.projects) }}
        gps_model: [6m, m9n]
    env:
      CARGO_BUILD_JOBS: '4'
      GPS_MODEL: ${{ matrix.gps_model }}
      GPS_RATE: ${{ matrix.gps_model == 'm9n' && '25' || '5' }}
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-10-18
          components: rust-src


      - name: Install pinned image packager and linker
        run: |
          rustup toolchain install stable --profile minimal
          command -v ldproxy >/dev/null || cargo +stable install ldproxy --locked
          if ! espflash --version 2>/dev/null | grep -qx 'espflash 4.7.0'; then
            cargo +stable install espflash --version 4.7.0 --locked
          fi

      - name: Build firmware
        run: |
          source "$GITHUB_WORKSPACE/scripts/cargo-cache.sh" nightly-2025-10-18 firmware
          cd sensors/${{ matrix.project }}
          cargo +nightly-2025-10-18 build --release --locked --target riscv32imc-esp-espidf

      - name: Generate flashable binary
        run: |
          cd sensors/${{ matrix.project }}

          # Create output directory
          mkdir -p ../../firmware-output

          # Full image: ESP32-C3 bootloader begins at address zero.
          espflash save-image \
            --chip esp32c3 --merge --flash-size 4mb \
            --bootloader "$CARGO_TARGET_DIR/riscv32imc-esp-espidf/release/bootloader.bin" \
            --partition-table ../../partitions.csv \
            "$CARGO_TARGET_DIR/riscv32imc-esp-espidf/release/blackbox" \
            ../../firmware-output/${{ matrix.project }}-${{ matrix.gps_model }}.bin
          python3 ../../scripts/check_release_image.py \
            ../../firmware-output/${{ matrix.project }}-${{ matrix.gps_model }}.bin \
            --expected-version "${{ steps.get_version.outputs.VERSION }}"
          cd ../../firmware-output
          sha256sum *.bin > SHA256SUMS-${{ matrix.gps_model }}.txt

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v6
        with:
          name: firmware-${{ matrix.project }}-${{ matrix.gps_model }}
          path: firmware-output/*

      - name: Wait for firmware artifact index
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_artifact.py firmware-${{ matrix.project }}-${{ matrix.gps_model }}

  create-release:
    name: Create GitHub Release
    needs: build-firmware
    runs-on: [blackbox-lat]
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ needs.build-firmware.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download all firmware artifacts
        uses: actions/download-artifact@v7
        with:
          github-token: ${{ github.token }}
          path: firmware-artifacts

      - name: Extract changelog
        id: changelog
        run: |
          VERSION=${{ needs.build-firmware.outputs.version }}
          VERSION_NUM=${VERSION#v}
          awk -v ver="$VERSION_NUM" '
            /^## \[/ {
              if (found) exit;
              if ($2 == "["ver"]") found=1;
              next;
            }
            found { print }
          ' CHANGELOG.md > release-notes.md || echo "Release $VERSION" > release-notes.md

      - name: Prepare release files
        run: |
          # Find all firmware binaries and create a list
          find firmware-artifacts -name "*.bin" -type f

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-firmware.outputs.version }}
          name: Release ${{ needs.build-firmware.outputs.version }}
          body_path: release-notes.md
          files: |
            firmware-artifacts/firmware-*/*.bin
            firmware-artifacts/firmware-*/SHA256SUMS-*.txt
          draft: false
          prerelease: ${{ contains(needs.build-firmware.outputs.version, 'alpha') || contains(needs.build-firmware.outputs.version, 'beta') || contains(needs.build-firmware.outputs.version, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
