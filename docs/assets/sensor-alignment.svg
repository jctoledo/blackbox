<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 210" style="width:100%;height:auto;display:block" role="img" aria-labelledby="alignment-title alignment-desc">
<title id="alignment-title">Align the sensor's forward direction with the car</title>
<desc id="alignment-desc">Top view. The car points up. The sensor is mounted rotated to the right. Alignment learns the angle between the car-forward and sensor-forward arrows.</desc>
<defs><marker id="car-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#d7ff45"/></marker><marker id="sensor-arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64d3e3"/></marker></defs>
<rect width="360" height="210" rx="12" fill="#101820"/>
<g fill="none" stroke="#687b89" stroke-width="1.5"><rect x="132" y="22" width="96" height="169" rx="31"/><path d="M142 67Q180 52 218 67M142 150Q180 160 218 150"/><path d="M127 59v25m106-25v25m-106 57v25m106-25v25" stroke-width="5"/></g>
<g transform="rotate(28 180 120)"><rect x="162" y="99" width="36" height="43" rx="4" fill="#203742" stroke="#64d3e3"/><path d="M180 120V40" stroke="#64d3e3" stroke-width="2.5" marker-end="url(#sensor-arrow)"/></g>
<path d="M180 120V28" stroke="#d7ff45" stroke-width="2.5" marker-end="url(#car-arrow)"/>
<path d="M180 76A44 44 0 0 1 201 81" fill="none" stroke="#edf3f8" stroke-width="2"/>
<g font-family="system-ui,sans-serif" font-size="13" fill="#edf3f8"><text x="18" y="38" fill="#d7ff45">Car forward</text><text x="249" y="51" fill="#64d3e3">Sensor</text><text x="249" y="68" fill="#64d3e3">forward</text><text x="18" y="180">TOP VIEW</text><text x="249" y="122">Learn this</text><text x="249" y="139">rotation</text></g>
<path d="M102 35L173 31M243 65L221 58M243 118L201 82" stroke="#8496a4" stroke-width="1" fill="none"/>
</svg>
